<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paladium Optimiseur V12</title>
    <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JJ3D6F5L7S"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JJ3D6F5L7S');
</script>

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5597142717067268" crossorigin="anonymous"></script>
    <
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Optimiseur de Métiers & Clicker Paladium V12</h1>

        <!-- Section Calculateur d'XP -->
        <section class="calculator-section">
            <h2>Calculateur d'XP</h2>
            <form id="xpForm">
                <label for="job">Métier :</label>
                <select id="job">
                    <option value="mineur">Mineur</option>
                    <option value="farmer">Farmer</option>
                    <option value="alchimiste">Alchimiste</option>
                    <option value="chasseur">Chasseur</option>
                </select>

                <label for="currentLevel">Niveau actuel :</label>
                <input type="number" id="currentLevel" min="1" max="100" value="1">

                <label for="targetLevel">Niveau ciblé :</label>
                <input type="number" id="targetLevel" min="1" max="100" value="10">

                <button type="button" id="btnCalculate">Calculer</button>
            </form>

            <div id="result" class="result-box"></div>
        </section>

        <!-- Section Mini-Jeu Clicker -->
        <section class="clicker-section">
            <h2>Paladium Clicker</h2>
            <div class="score-display">
                <p>Paladium miné : <span id="clickCount">0</span></p>
                <p>Production : <span id="autoDisplay">0 / sec</span></p>
            </div>
            <button id="btnClick" class="click-btn">Miner du Paladium</button>
        </section>
    </main>

    <!-- Script JavaScript principal -->
    <script>
        // --- LOGIQUE MINI-JEU CLICKER ---
        let count = 0;
        let autoValue = 0;

        const countEl = document.getElementById('clickCount');
        const autoEl = document.getElementById('autoDisplay');
        const clickBtn = document.getElementById('btnClick');

        // Met à jour l'affichage en utilisant les template literals (backticks ` `)
        function updateDisplay() {
            countEl.textContent = count;
            autoEl.textContent = `${autoValue} / sec`;
        }

        clickBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        // Boucle d'automatisation (1 fois par seconde)
        setInterval(() => {
            if (autoValue > 0) {
                count += autoValue;
                updateDisplay();
            }
        }, 1000);
    </script>
    <script src="script.js"></script>
</body>
</html>
