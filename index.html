<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paladium Optimiseur & Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= PUB ADSTERRA HAUT (728x90) ================= -->
  <div style="text-align: center; margin-bottom: 20px;">
    <script type="text/javascript">
      atOptions = {
        'key' : '44a740483366b2a5ba983f7a6b491274',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://www.highrevenueformat.com/44a740483366b2a5ba983f7a6b491274/invoke.js"></script>
  </div>

  <div class="main-wrapper">
    
    <!-- BLOC 1 : CALCULATEUR MINEUR -->
    <div class="card">
      <h1>PALADIUM</h1>
      <p class="subtitle">Optimiseur Métier Mineur</p>

      <div class="form-group">
        <label>Niveau Actuel</label>
        <input type="number" id="currentLevel" value="1" min="1" max="100">
      </div>

      <div class="form-group">
        <label>XP Actuelle</label>
        <input type="number" id="currentXP" value="0">
      </div>

      <div class="form-group">
        <label>Niveau Visé</label>
        <input type="number" id="targetLevel" value="5" min="1" max="100">
      </div>

      <div class="form-group">
        <label>Minerai / Bloc de Farm (Paladium V12)</label>
        <select id="ore">
          <optgroup label="Minerais Rares & Légendaires (V12)">
            <option value="100">Paladium / Greenium / Endium (100 XP)</option>
            <option value="60">Findium (60 XP)</option>
            <option value="40">Améthyste (40 XP)</option>
            <option value="25">Titane (25 XP)</option>
            <option value="15">Mithril (15 XP)</option>
          </optgroup>
          <optgroup label="Minerais Classiques">
            <option value="10">Minerai de Diamant (10 XP)</option>
            <option value="8">Minerai d'Or (8 XP)</option>
            <option value="5">Minerai de Fer (5 XP)</option>
            <option value="4">Lapis-Lazuli / Redstone (4 XP)</option>
            <option value="3">Minerai de Charbon (3 XP)</option>
          </optgroup>
          <optgroup label="Minage de Masse & Nether">
            <option value="1">Quartz / Netherrack (1 XP)</option>
            <option value="0.5">Pierre / Stone (0.5 XP)</option>
            <option value="0.2">Terre / Gravel / Sable (0.2 XP)</option>
          </optgroup>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="booster" checked>
        <label for="booster">Booster XP Actif (+50%)</label>
      </div>

      <button id="calc-btn">Calculer l'objectif</button>

      <div class="result-box" id="result">
        Rentre tes données et lance le calcul.
      </div>
    </div>

    <!-- BLOC 2 : PALADIUM CLICKER -->
    <div class="card">
      <h1>PALADIUM CLICKER</h1>
      <p class="subtitle">Mine en attendant ton farm !</p>

      <div class="clicker-score">
        <div id="score">0</div>
        <div class="sub-label">Paladiums minés</div>
        <div id="pps">0 / seconde</div>
      </div>

      <button id="click-btn">🔨 MINER !</button>

      <div class="shop">
        <h3>Boutique</h3>

        <div class="upgrade-item">
          <div>
            <strong>Pioche renforcée</strong> (+1/clic)<br>
            <small>Coût: <span id="cost-click">15</span></small>
          </div>
          <button id="buy-click">Acheter (<span id="count-click">0</span>)</button>
        </div>

        <div class="upgrade-item">
          <div>
            <strong>Mineur Auto</strong> (+1/sec)<br>
            <small>Coût: <span id="cost-auto">50</span></small>
          </div>
          <button id="buy-auto">Acheter (<span id="count-auto">0</span>)</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ================= PUB ADSTERRA BAS (300x250) ================= -->
  <div style="text-align: center; margin-top: 25px;">
    <script type="text/javascript">
      atOptions = {
        'key' : 'b895e293104aa6116445460d4e0dd1fe',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://www.highrevenueformat.com/b895e293104aa6116445460d4e0dd1fe/invoke.js"></script>
  </div>

  <script src="script.js"></script>
</body>
</html>
