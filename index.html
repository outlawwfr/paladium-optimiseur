<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Meta de base -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titre unique pour Google -->
  <title>Calculatrice XP Métier Paladium V12 | Optimiseur & Clicker</title>

  <!-- Descriptions et Mots-clés -->
  <meta name="description" content="Optimisez votre ferme sur Paladium V12 ! Calculez rapidement votre XP de métier.">
  <meta name="keywords" content="Paladium, Paladium V12, calculateur XP Paladium, optimiseur métier, minage Paladium">

<!-- Favicon & CSS -->
  <link rel="icon" type="image/png" href="Pioche_Palmium.webp">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph / Discord -->
  <meta property="og:title" content="Calculatrice XP Métier Paladium V12">
  <meta property="og:description" content="Calcule et optimise ton XP de métier sur Paladium V12 en quelques clics.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://outlawwfr.github.io/paladium-optimiseur/">
  <meta property="og:image" content="Pioche_Palmium.webp">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5597142717067268" crossorigin="anonymous"></script>
</head>
<body>
  <div class="main-wrapper">
    
    <!-- BLOC 1 : CALCULATEUR MÉTIERS V12 -->
    <div class="card">
      <h1>PALADIUM V12</h1>
      <p class="subtitle">Optimiseur Métiers</p>
      <div class="form-group">
        <label>Choisis ton Métier</label>
        <select id="jobSelect">
          <option value="miner">⛏️ Mineur</option>
          <option value="farmer">🌾 Farmer</option>
          <option value="alchemist">🧪 Alchimiste</option>
          <option value="hunter">⚔️ Hunter (Chasseur)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Niveau Actuel</label>
        <input type="number" id="currentLevel" value="1" min="1" max="100">
      </div>
      <div class="form-group">
        <label>XP Actuelle</label>
        <input type="number" id="currentXP" value="0">
      </div>
      <div class="form-group">
        <label>Niveau Visé</label>
        <input type="number" id="targetLevel" value="5" min="1" max="100">
      </div>
      <div class="form-group">
        <label>Action / Item de Farm</label>
        <select id="ore">
          <!-- Chargé dynamiquement par JS -->
        </select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="booster" checked>
        <label for="booster">Booster XP Actif (+50%)</label>
      </div>
      <button id="calc-btn">Calculer l'objectif</button>
      <div class="result-box" id="result">
        Sélectionne ton métier et lance le calcul.
      </div>
    </div>
    <!-- BLOC 2 : PALADIUM CLICKER -->
    <div class="card">
      <h1>PALADIUM CLICKER</h1>
      <p class="subtitle">Mine en attendant ton farm !</p>
      <div class="clicker-score">
        <div id="score">0</div>
        <div class="sub-label">Paladiums minés</div>
        <div id="pps">0 / seconde</div>
      </div>
      <button id="click-btn">🔨 MINER !</button>
      <div class="shop">
        <h3>Boutique</h3>
        <div class="upgrade-item">
          <div>
            <strong>Pioche renforcée</strong> (+1/clic)<br>
            <small>Coût: <span id="cost-click">15</span></small>
          </div>
          <button id="buy-click">Acheter (<span id="count-click">0</span>)</button>
        </div>
        <div class="upgrade-item">
          <div>
            <strong>Mineur Auto</strong> (+1/sec)<br>
            <small>Coût: <span id="cost-auto">50</span></small>
          </div>
          <button id="buy-auto">Acheter (<span id="count-auto">0</span>)</button>
        </div>
      </div>
    </div>
  </div>
  <!-- BLOC PUBLICITAIRE ADSENSE -->
  <div style="text-align: center; margin-top: 25px;">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-5597142717067268"

         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>
  <script src="script.js"></script>
</body>
</html>
